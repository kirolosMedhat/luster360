name: Build LUSTER 360 Mobile Apps (Android APK & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Release APK
        run: |
          cd mobile_app
          flutter build apk --release --split-per-abi

      - name: Upload Universal Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Luster360-Android-Release-APKs
          path: mobile_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  build-ios:
    name: Build iOS App (macOS Cloud Runner)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build iOS Release Bundle (No Codesign)
        run: |
          cd mobile_app
          flutter build ios --release --no-codesign

      - name: Compress iOS App Payload
        run: |
          cd mobile_app/build/ios/iphoneos
          zip -r ../../../Luster360-iOS-Runner.zip Runner.app

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luster360-iOS-Runner
          path: Luster360-iOS-Runner.zip
          retention-days: 30
